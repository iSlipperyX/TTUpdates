# Builds TikTok Manager on Windows: the app folder, TikTokManager-windows.zip (what installed copies
# update from) and the TikTokManager-Setup.exe installer.
#
# - A pushed version tag (v1.3.0, made by `python release.py 1.3.0`) builds and publishes the release.
# - A pull request that touches the build, or a manual run, only builds and keeps the files as a
#   workflow artifact, so packaging problems show up before a release.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", "build.py", "pyproject.toml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Check the tag matches the app version and has notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "from tokmanager.config import VERSION; print(VERSION)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION in tokmanager/config.py ($version). Use: python release.py <version>"
            exit 1
          fi
          if [ ! -f "release-notes/$GITHUB_REF_NAME.md" ]; then
            echo "::error::release-notes/$GITHUB_REF_NAME.md is missing"
            exit 1
          fi

      - name: Build
        run: python build.py --installer

      - name: Check the build starts
        shell: pwsh
        run: |
          $p = Start-Process dist\TikTokManager\TikTokManager.exe -ArgumentList "--selftest" -PassThru -Wait
          Get-Content "$env:APPDATA\TikTokManager\selftest.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "The built app's self-test failed (exit code $($p.ExitCode))." }

      - name: Keep the build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: TikTokManager-build
          path: |
            dist/TikTokManager-windows.zip
            dist/TikTokManager-windows.zip.sha256
            dist/TikTokManager-Setup.exe
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are what the app shows under "What's new", so they're used as written.
          gh release create "$GITHUB_REF_NAME" \
            dist/TikTokManager-windows.zip dist/TikTokManager-windows.zip.sha256 dist/TikTokManager-Setup.exe \
            --title "TikTok Manager ${GITHUB_REF_NAME#v}" --notes-file "release-notes/$GITHUB_REF_NAME.md" --latest
