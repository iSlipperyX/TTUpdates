[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokmanager"
dynamic = ["version"]
description = "TikTok Manager: score your videos, queue them in order, post them to TikTok and track how they do."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.7",
    "imageio-ffmpeg>=0.5",
    "playwright>=1.48",
    "requests>=2.31",
    "anthropic>=1.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
dev = ["pytest>=8", "pyflakes"]

[project.gui-scripts]
tiktok-manager = "tokmanager.gui.app:main"

[tool.setuptools]
packages = ["tokmanager", "tokmanager.gui", "tokmanager.tiktok"]

[tool.setuptools.dynamic]
version = {attr = "tokmanager.config.VERSION"}  # release.py bumps it there

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
